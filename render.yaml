services:
  - type: web
    name: maintenance-tracker-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maintenance-tracker-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: maintenance-tracker-db
    plan: free
